trigger:
  branches:
    include:
      - main
pr: none

pool:
  vmImage: ubuntu-22.04

stages:
- stage: CI
  displayName: Build, test, package
  jobs:
  - job: Build
    steps:
    - checkout: self
    - task: UseNode@1
      inputs:
        version: '22.x'
    - script: npm ci
      displayName: Install locked dependencies
    - script: npm run build
      displayName: Compile TypeScript
    - script: npm test
      displayName: Run automated tests
    - script: |
        mkdir -p "$(Build.ArtifactStagingDirectory)/webapp"
        cp package.json package-lock.json "$(Build.ArtifactStagingDirectory)/webapp/"
        cp -R dist public "$(Build.ArtifactStagingDirectory)/webapp/"
        cd "$(Build.ArtifactStagingDirectory)/webapp"
        npm ci --omit=dev
        echo "$(Build.SourceVersion)" > build-sha.txt
        zip -qr "$(Build.ArtifactStagingDirectory)/pulseops.zip" .
      displayName: Package production app
    - publish: '$(Build.ArtifactStagingDirectory)/pulseops.zip'
      artifact: webapp-drop
      displayName: Publish reusable artifact

- stage: CD
  displayName: Deploy published artifact
  dependsOn: CI
  condition: succeeded()
  jobs:
  - deployment: DeployWebApp
    environment: pulseops-production
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: webapp-drop
          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'PulseOps Azure WIF'
              appType: 'webAppLinux'
              appName: 'pulseops-delivery-itm-2026'
              package: '$(Pipeline.Workspace)/webapp-drop/pulseops.zip'
              runtimeStack: 'NODE|22-lts'
          - script: |
              curl --fail --silent --show-error --retry 8 --retry-delay 5 "https://pulseops-delivery-itm-2026.azurewebsites.net/api/health" | tee health.json
              grep -q '"status":"ok"' health.json
            displayName: Verify public health endpoint






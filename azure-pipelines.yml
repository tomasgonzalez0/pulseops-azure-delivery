trigger:
  branches:
    include:
      - main
pr: none

pool:
  vmImage: ubuntu-latest

stages:
- stage: CI
  displayName: Build, test, package
  jobs:
  - job: Build
    steps:
    - checkout: self
    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'
    - script: npm ci
      displayName: Install locked dependencies
    - script: npm run build
      displayName: Compile TypeScript
    - script: npm test
      displayName: Run automated tests
    - script: |
        mkdir -p "$(Build.ArtifactStagingDirectory)/webapp"
        cp package.json package-lock.json "$(Build.ArtifactStagingDirectory)/webapp/"
        cp -R dist public "$(Build.ArtifactStagingDirectory)/webapp/"
        cd "$(Build.ArtifactStagingDirectory)/webapp"
        npm ci --omit=dev
        echo "$(Build.SourceVersion)" > build-sha.txt
        zip -qr "$(Build.ArtifactStagingDirectory)/pulseops.zip" .
      displayName: Package production app
    - publish: '$(Build.ArtifactStagingDirectory)/pulseops.zip'
      artifact: webapp-drop
      displayName: Publish reusable artifact
